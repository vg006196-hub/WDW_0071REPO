<!DOCTYPE html>
<html>
    <head>
        <title>Hotel Booking Form</title>
    </head>
    <body>
        <center>
        <h2>Hotel room booking form</h2>
        <form>
       Full Name:<input type="text" required><br><br>
       Email:<input type="text" required><br><br>
       Phone: <input type="tel" required><br><br>
       Check-in Date:<input type="date" required><br><br>
       Check-out Date:<input type="date"<br></br>
       Room type:
       <select>
        <option>Singal Room</option>
        <option>Double Room</option>
        <option>Deluxe Room</option>
       </select><br><br>
       Number of Guests:<input type="number"><br></>br>
         Special Requests:<br>
         <textarea rows="4" cols="30"></textarea><br><br>
         <input type="submit" value="Book now">
         <input type="reset" value="Reset Form">
         </form>
         </center>
     </body>
</html>
